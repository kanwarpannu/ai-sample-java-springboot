spring:
  application:
    name: onboarding-mcp-server
  datasource:
    url: jdbc:postgresql://localhost:5432/onboarding_db
    username: onboarding
    password: onboarding
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: onboarding-mcp-server
        version: "1.0.0"

server:
  port: 8082
