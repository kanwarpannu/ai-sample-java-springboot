spring:
  application:
    name: onboarding-agent-service
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma4
    model:
      chat: ollama
    mcp:
      client:
        enabled: true
        streamable-http:
          connections:
            onboarding-server:
              url: http://localhost:8082/mcp
            knowledge-server:
              url: http://localhost:8081/mcp

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
